<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#090909" />
  <title>BRAVE༒KINGS Name Generator</title>
  <style>
    :root { color-scheme: dark; --red: #e11d48; --panel: #171717; --muted: #a3a3a3; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 24px 14px; display: grid; place-items: center; background: radial-gradient(ellipse at top, #3a1018 0%, #111 42%, #050505 100%); color: #fff; font-family: system-ui, Arial, sans-serif; }
    main { width: min(100%, 460px); }
    .card { background: rgba(20,20,20,.96); border: 1px solid #3f2027; border-radius: 20px; padding: 24px; box-shadow: 0 18px 60px #0008; }
    .crest { width: 68px; height: 68px; display: grid; place-items: center; margin: 0 auto 12px; border: 2px solid var(--red); border-radius: 50%; font-size: 25px; font-weight: 900; }
    h1 { margin: 0; text-align: center; font-size: clamp(23px, 6vw, 30px); letter-spacing: 1px; }
    .subtitle { margin: 8px 0 22px; text-align: center; color: var(--muted); font-size: 14px; }
    .guild { text-align: center; border: 1px solid #393939; background: #101010; border-radius: 12px; padding: 12px 8px; margin-bottom: 20px; }
    .guild-label, label { display: block; color: #d4d4d4; font-size: 13px; margin-bottom: 8px; }
    .guild-name { font-size: 21px; font-weight: 800; letter-spacing: .5px; }
    label { margin-top: 15px; }
    input, select { width: 100%; padding: 13px 14px; border-radius: 10px; border: 1px solid #444; background: #090909; color: #fff; font: inherit; outline: none; }
    input:focus, select:focus { border-color: var(--red); }
    button { width: 100%; padding: 13px 14px; border: 0; border-radius: 10px; background: var(--red); color: white; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 15px; }
    button.secondary { background: #292929; border: 1px solid #444; margin-top: 10px; }
    button:active { transform: scale(.99); }
    .result-wrap { margin-top: 20px; }
    .result-label { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
    #result { min-height: 54px; display: flex; align-items: center; justify-content: center; text-align: center; overflow-wrap: anywhere; padding: 13px 8px; border-radius: 10px; border: 1px dashed #6b2937; background: #0a0a0a; font-size: 21px; font-weight: 800; }
    .hint { color: var(--muted); font-size: 12px; line-height: 1.5; text-align: center; margin: 16px 0 0; }
    #status { min-height: 18px; color: #fda4af; text-align: center; font-size: 13px; margin-top: 8px; }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <div class="crest" aria-hidden="true">BK</div>
      <h1 id="page-title">BRAVE༒KINGS</h1>
      <p class="subtitle">FREE FIRE NAME GENERATOR</p>

      <div class="guild">
        <span class="guild-label">OFFICIAL GUILD NAME</span>
        <div class="guild-name">ʙʀᴀᴠᴇ ༒ ᴋɪɴɢs</div>
      </div>

      <label for="playerName">Enter your name</label>
      <input id="playerName" type="text" maxlength="18" placeholder="Type your name" autocomplete="off" />

      <label for="style">Choose your tag</label>
      <select id="style">
        <option value="male">Male — BK symbol tag</option>
        <option value="female">Female — BK flower tag</option>
      </select>

      <button id="generate" type="button">GENERATE NAME</button>

      <div class="result-wrap" aria-live="polite">
        <div class="result-label">YOUR FREE FIRE NAME</div>
        <div id="result">ʙᴋㅤ༒ㅤsᴀᴛʜᴀɴ</div>
        <button id="copy" class="secondary" type="button">COPY NAME</button>
        <div id="status" role="status"></div>
      </div>
      <p class="hint">Male format: ʙᴋㅤ༒ㅤname<br>Female format: ʙᴋㅤ✿ㅤname<br>Free Fire may limit which characters or spaces are accepted.</p>
    </section>
  </main>
  <script>
    const smallCaps = {
      a:'ᴀ', b:'ʙ', c:'ᴄ', d:'ᴅ', e:'ᴇ', f:'ғ', g:'ɢ', h:'ʜ', i:'ɪ', j:'ᴊ', k:'ᴋ',
      l:'ʟ', m:'ᴍ', n:'ɴ', o:'ᴏ', p:'ᴘ', q:'ǫ', r:'ʀ', s:'s', t:'ᴛ', u:'ᴜ', v:'ᴠ',
      w:'ᴡ', x:'x', y:'ʏ', z:'ᴢ'
    };
    const input = document.getElementById('playerName');
    const style = document.getElementById('style');
    const result = document.getElementById('result');
    const status = document.getElementById('status');

    function stylizeName(value) {
      return [...value.trim()].map(char => smallCaps[char.toLowerCase()] || char).join('');
    }
    function generateName() {
      const raw = input.value.trim();
      if (!raw) {
        status.textContent = 'Type a name first.';
        input.focus();
        return;
      }
      const name = stylizeName(raw).replace(/\s+/g, ' ');
      const prefix = style.value === 'female' ? 'ʙᴋㅤ✿ㅤ' : 'ʙᴋㅤ༒ㅤ';
      result.textContent = prefix + name;
      status.textContent = '';
    }
    document.getElementById('generate').addEventListener('click', generateName);
    input.addEventListener('keydown', event => { if (event.key === 'Enter') generateName(); });
    style.addEventListener('change', () => { if (input.value.trim()) generateName(); });
    document.getElementById('copy').addEventListener('click', async () => {
      const textToCopy = result.textContent;
      try {
        await navigator.clipboard.writeText(textToCopy);
        status.textContent = 'Copied! Paste it into Free Fire.';
      } catch (error) {
        const area = document.createElement('textarea');
        area.value = textToCopy;
        area.style.position = 'absolute';
        area.style.left = '-9999px';
        document.body.appendChild(area);
        area.select();
        const copied = document.execCommand('copy');
        area.remove();
        status.textContent = copied ? 'Copied! Paste it into Free Fire.' : 'Copy failed. Select the name and copy it manually.';
      }
    });
  </script>
</body>
</html>
